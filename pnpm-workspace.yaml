packages:
  - apps/*
  - packages/*
allowBuilds:
  "@nestjs/core": false
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - tsx@4.22.4
  - "@aws-sdk/client-s3@3.1058.0"
  - "@aws-sdk/credential-provider-node@3.972.48"
